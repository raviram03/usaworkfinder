<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-15M145JMVP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-15M145JMVP');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USAWorkFinder — Find Work Across America</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545; --red:#B31942; --paper:#FAF9F6; --ink:#161A1D;
    --muted:#5B6472; --line:#E3E0D8; --gold:#C9A227; --card:#FFFFFF;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{--paper:#0F1215;--ink:#EDEFF2;--muted:#96A0AC;--line:#262B31;--card:#171B1F;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#0F1215;--ink:#EDEFF2;--muted:#96A0AC;--line:#262B31;--card:#171B1F;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.55;}
  h1,h2{font-family:"Fraunces",Georgia,serif;}

  .ribbon{height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 40px,#fff 40px 44px,var(--red) 44px 84px,#fff 84px 88px);}

  header{background:var(--navy);color:#fff;padding:2.6rem 1.5rem 3.4rem;}
  .wrap{max-width:920px;margin:0 auto;}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;}
  .brand{display:flex;align-items:center;gap:.55rem;font-size:1.05rem;font-weight:600;letter-spacing:.02em;color:#EDEFF2;}
  .flag{border-radius:2px;flex-shrink:0;}
  .theme-toggle{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#EDEFF2;border-radius:20px;padding:.4rem .9rem;font-size:.85rem;font-family:"Inter",sans-serif;cursor:pointer;display:flex;align-items:center;gap:.4rem;}
  .theme-toggle:hover{background:rgba(255,255,255,.18);}
  header h1{font-size:2.4rem;font-weight:600;margin:0 0 .6rem;letter-spacing:-.01em;max-width:16ch;}
  header p{color:#C7CEDA;font-size:1.08rem;margin:0;max-width:42ch;}

  .search-card{max-width:920px;margin:-2.2rem auto 0;background:var(--card);border-radius:6px;box-shadow:0 10px 30px rgba(11,37,69,.14);padding:1.3rem;display:flex;gap:.7rem;flex-wrap:wrap;position:relative;z-index:2;}
  input,button{font-family:"Inter",sans-serif;font-size:1rem;padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:4px;}
  input{flex:2;min-width:170px;background:var(--card);color:var(--ink);}
  input:focus,button:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button.go{background:var(--red);color:#fff;border-color:var(--red);font-weight:600;cursor:pointer;flex:0 0 auto;}
  button.go:hover{background:#9A1636;}

  main{max-width:920px;margin:0 auto;padding:2.6rem 1.5rem 4rem;}
  .section-label{color:var(--muted);font-size:.9rem;font-weight:500;margin:0 0 1.2rem;}
  .job{border:1px solid var(--line);border-left:3px solid var(--navy);background:var(--card);border-radius:4px;padding:1.2rem 1.3rem;margin-bottom:.9rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
  .job h3{margin:0 0 .25rem;font-size:1.15rem;font-family:"Fraunces",Georgia,serif;font-weight:600;}
  .job a{color:var(--ink);text-decoration:none;}
  .job a:hover{color:var(--red);}
  .job .co{color:var(--navy);font-weight:600;font-size:.96rem;}
  :root[data-theme="dark"] .job .co{color:#7FA8D9;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .job .co{color:#7FA8D9;}}
  .job .meta{color:var(--muted);font-size:.9rem;margin-top:.3rem;}
  .pay{white-space:nowrap;font-weight:600;color:var(--navy);align-self:center;background:#EEF2F7;padding:.4rem .8rem;border-radius:4px;font-size:.95rem;}
  :root[data-theme="dark"] .pay{color:#EDEFF2;background:#232A33;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pay{color:#EDEFF2;background:#232A33;}}
  .empty{text-align:center;color:var(--muted);padding:3.5rem 1rem;font-style:italic;border:1px dashed var(--line);border-radius:6px;}

  footer{border-top:1px solid var(--line);padding:1.6rem 1.5rem;text-align:center;color:var(--muted);font-size:.85rem;}
</style>
</head>
<body>
<div class="ribbon"></div>
<header>
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <svg class="flag" width="26" height="18" viewBox="0 0 26 18" xmlns="http://www.w3.org/2000/svg">
          <rect width="26" height="18" fill="#B31942"/>
          <rect y="1.38" width="26" height="1.38" fill="#fff"/>
          <rect y="4.15" width="26" height="1.38" fill="#fff"/>
          <rect y="6.92" width="26" height="1.38" fill="#fff"/>
          <rect y="9.69" width="26" height="1.38" fill="#fff"/>
          <rect y="12.46" width="26" height="1.38" fill="#fff"/>
          <rect y="15.23" width="26" height="1.38" fill="#fff"/>
          <rect width="11" height="9.69" fill="#0A3161"/>
        </svg>
        USAWorkFinder
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
    </div>
    <h1>Find work across America.</h1>
    <p>Live listings pulled from employers nationwide — one search, every state.</p>
  </div>
</header>

<div class="search-card">
  <input id="q" placeholder="Job title — e.g. Accountant">
  <input id="loc" placeholder="City or state (optional)">
  <button class="go" onclick="search()">Search jobs</button>
</div>

<main>
  <p class="section-label" id="label">Search above to see live listings.</p>
  <div id="jobs"></div>
</main>

<footer>USAWorkFinder — job listings aggregated for the U.S. market.</footer>

<script>
function applyStoredTheme(){
  const saved = localStorage.getItem('theme');
  if(saved){
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️ Light' : '🌙 Dark';
  }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️ Light' : '🌙 Dark';
  try{ localStorage.setItem('theme', next); }catch(e){}
}
try{ applyStoredTheme(); }catch(e){}

async function search(){
  const what = document.getElementById('q').value;
  const where = document.getElementById('loc').value;
  const el = document.getElementById('jobs');
  const label = document.getElementById('label');
  label.textContent = 'Searching…';
  el.innerHTML = '';
  try{
    const res = await fetch(`/.netlify/functions/jobs?what=${encodeURIComponent(what)}&where=${encodeURIComponent(where)}`);
    const jobs = await res.json();
    if(jobs.length){
      label.textContent = `${jobs.length} jobs found`;
      el.innerHTML = jobs.map(j => `
        <div class="job">
          <div>
            <h3><a href="${j.url}" target="_blank">${j.title}</a></h3>
            <div class="co">${j.co}</div>
            <div class="meta">${j.loc} · ${j.cat}</div>
          </div>
          <div class="pay">${j.pay}</div>
        </div>`).join('');
    } else {
      label.textContent = '';
      el.innerHTML = '<div class="empty">No jobs found — try a different search.</div>';
    }
  }catch(e){
    label.textContent = '';
    el.innerHTML = '<div class="empty">Something went wrong. Try again.</div>';
  }
}
</script>
</body>
</html>
